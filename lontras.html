<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maria Fumaça - Tempo Real</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @keyframes puff {
            0% { transform: scale(0.3) translate(0, 0); opacity: 0.8; filter: blur(1px); }
            100% { transform: scale(1.6) translate(-15px, -25px); opacity: 0; filter: blur(5px); }
        }
        .smoke-particle {
            position: absolute;
            background: rgba(200, 200, 200, 0.6);
            border-radius: 50%;
            pointer-events: none;
            animation: puff 1.5s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans overflow-hidden">

    <div class="absolute top-4 left-1/2 transform -translate-x-1/2 z-[1000] bg-gray-800/95 backdrop-blur-md px-6 py-4 rounded-xl shadow-2xl border border-gray-700 flex flex-col sm:flex-row items-center gap-4 w-11/12 max-w-2xl">
        <div class="flex items-center gap-3">
            <div class="p-3 bg-amber-600 rounded-lg text-2xl animate-pulse">
                <i class="fa-solid fa-train text-gray-900"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-wide text-amber-400">Expresso Tempo Real</h1>
                <p id="status-txt" class="text-xs text-gray-400">Velocidade simulada: 32 km/h</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2 ml-auto w-full sm:w-auto justify-end">
            <button id="btn-play" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 px-4 rounded-lg transition-all flex items-center gap-2">
                <i class="fa-solid fa-play"></i> Partir
            </button>
            <button id="btn-pause" class="bg-amber-600 hover:bg-amber-500 text-white font-semibold py-2 px-4 rounded-lg transition-all hidden flex items-center gap-2">
                <i class="fa-solid fa-pause"></i> Pausar
            </button>
            <button id="btn-reset" class="bg-gray-700 hover:bg-gray-600 text-white font-semibold py-2 px-4 rounded-lg transition-all border border-gray-600 flex items-center gap-2">
                <i class="fa-solid fa-rotate-left"></i> Reiniciar
            </button>
        </div>
    </div>

    <div class="absolute bottom-6 left-6 z-[1000] bg-gray-900/85 backdrop-blur-md p-4 rounded-lg border border-gray-700 shadow-xl pointer-events-none text-sm hidden sm:block">
        <div class="grid grid-cols-2 gap-x-4 gap-y-1">
            <span class="text-gray-400">Velocidade Fictícia:</span> <span class="font-mono text-emerald-400">32.0 km/h</span>
            <span class="text-gray-400">Altitude:</span> <span id="tel-ele" class="font-mono text-amber-400">---</span>
            <span class="text-gray-400">Distância do Trecho:</span> <span id="tel-dist" class="font-mono text-gray-300">---</span>

    </div>

        // CONFIGURAÇÕES DE VELOCIDADE REAL (Maria Fumaça histórica a ~32 km/h)
        const SIMULATED_SPEED_KMH = 32; 
        const SPEED_MPS = SIMULATED_SPEED_KMH / 3.6; // Convertido para metros por segundo (8.88 m/s)

        let currentIndex = 0;
        let isPlaying = false;
        let timeoutId = null;
        let smokeInterval = null;
        let totalDistanceTraveled = 0;

        // Elementos UI
        const btnPlay = document.getElementById('btn-play');
        const btnPause = document.getElementById('btn-pause');
        const btnReset = document.getElementById('btn-reset');
        const txtStatus = document.getElementById('status-txt');
        const telEle = document.getElementById('tel-ele');
        const telDist = document.getElementById('tel-dist');

        // Cálculo de distância real na Terra (Fórmula de Haversine)
        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000; // Raio da Terra em metros
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function calculateBearing(lat1, lon1, lat2, lon2) {
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
            const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                      Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        function emitSmoke() {
            if (!isPlaying) return;
            const point = map.latLngToContainerPoint(trainMarker.getLatLng());
            const smoke = document.createElement('div');
            smoke.className = 'smoke-particle';
            const size = Math.floor(Math.random() * 10) + 8;
            smoke.style.width = `${size}px`;
            smoke.style.height = `${size}px`;
            smoke.style.left = `${point.x - (size/2) + (Math.random() * 6 - 3)}px`;
            smoke.style.top = `${point.y - (size/2) + (Math.random() * 6 - 3)}px`;
            document.body.appendChild(smoke);
            setTimeout(() => smoke.remove(), 1500);
        }

        // Loop de Movimentação Baseado no Tempo Real do Próximo Trecho
        function tick() {
            if (!isPlaying) return;

            if (currentIndex >= gpxData.length - 1) {
                pauseSimulation();
                txtStatus.innerText = "Viagem encerrada com sucesso!";
                txtStatus.className = "text-xs text-emerald-400 font-bold";
                return;
            }

            const current = gpxData[currentIndex];
            const next = gpxData[currentIndex + 1];

            // Calcula a distância exata até o próximo ponto em metros
            const distance = getDistanceMeters(current.lat, current.lon, next.lat, next.lon);
            totalDistanceTraveled += distance;

            // t = d / v (Tempo em segundos que leva para cruzar este trecho específico)
            const timeRequiredSeconds = distance / SPEED_MPS;
            const timeRequiredMs = timeRequiredSeconds * 1000;

            // Executa a transição física no mapa
            trainMarker.setLatLng([next.lat, next.lon]);
            
            const bearing = calculateBearing(current.lat, current.lon, next.lat, next.lon);
            const markerDiv = document.getElementById('train-marker');
            if (markerDiv) markerDiv.style.transform = `rotate(${bearing + 90}deg)`;

            map.panTo([next.lat, next.lon]);

            // Atualiza Telemetria
            telEle.innerText = `${next.ele.toFixed(1)} m`;
            telDist.innerText = totalDistanceTraveled < 1000 ? 
                `${totalDistanceTraveled.toFixed(0)} metros` : 
                `${(totalDistanceTraveled / 1000).toFixed(2)} km`;

            currentIndex++;

            // Agenda dinamicamente o próximo ponto com o tempo correto calculado para o ambiente real
            timeoutId = setTimeout(tick, timeRequiredMs);
        }

        function startSimulation() {
            if (isPlaying) return;
            isPlaying = true;
            btnPlay.classList.add('hidden');
            btnPause.classList.remove('hidden');
            txtStatus.innerText = "Maria fumaça em velocidade real...";
            txtStatus.className = "text-xs text-emerald-400 animate-pulse";
            
            tick();
            smokeInterval = setInterval(emitSmoke, 120);
        }

        function pauseSimulation() {
            isPlaying = false;
            clearTimeout(timeoutId);
            clearInterval(smokeInterval);
            btnPause.classList.add('hidden');
            btnPlay.classList.remove('hidden');
            txtStatus.innerText = "Simulação pausada";
            txtStatus.className = "text-xs text-gray-400";
        }

        function resetSimulation() {
            pauseSimulation();
            currentIndex = 0;
            totalDistanceTraveled = 0;
            trainMarker.setLatLng(pathCoords[0]);
            map.setView(pathCoords[0], 15);
            telEle.innerText = `${gpxData[0].ele.toFixed(1)} m`;
            telDist.innerText = "0 metros";
            txtStatus.innerText = "Velocidade simulada: 32 km/h";
        }

        btnPlay.addEventListener('click', startSimulation);
        btnPause.addEventListener('click', pauseSimulation);
        btnReset.addEventListener('click', resetSimulation);

        // Init inicial
        telEle.innerText = `${gpxData[0].ele.toFixed(1)} m`;
        telDist.innerText = "0 metros";
        map.on('move', () => document.querySelectorAll('.smoke-particle').forEach(el => el.remove()));

    </script>
</body>
</html>
